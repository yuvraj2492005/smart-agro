<!DOCTYPE html>
<html>
<head>
<title>Admin Login</title>

<style>
body{
    font-family: Arial;
    background:#e8f5e9;
}

.box{
    width:350px;
    margin:100px auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px gray;
}

input,button{
    width:100%;
    padding:10px;
    margin:10px 0;
}

button{
    background:green;
    color:white;
    border:none;
    cursor:pointer;
}
</style>

</head>

<body>

<div class="box">

<h2>Admin Login</h2>

<input id="username" placeholder="Username">

<input id="password" type="password" placeholder="Password">

<button onclick="adminLogin()">Login</button>

<p id="msg"></p>

</div>


<script>

function adminLogin(){

let username=document.getElementById("username").value;

let password=document.getElementById("password").value;


fetch("http://localhost:3000/admin-login",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

username:username,

password:password

})

})

.then(res=>res.json())

.then(data=>{
console.log(data);

if(data.success){

alert("Admin Login Successful");

window.location.href="admin-dashboard.html";

}

else{

document.getElementById("msg").innerHTML=data.message;

}


});


}

</script>


</body>
</html>
